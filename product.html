{% extends "base.html" %}

{% block title %}
Product Details
{% endblock %}

{% block content %}

<div class="product-detail">

    <h1>{{ product.name }}</h1>

    <p>
        {{ product.description }}
    </p>

    <h2>
        ₹{{ product.price }}
    </h2>

    <form method="POST" action="/cart/add/{{ product.id }}">

        <label>Quantity</label>

        <input
            type="number"
            name="quantity"
            value="1"
            min="1"
        >

        <br><br>

        <button type="submit">
            Add to Cart
        </button>

    </form>

</div>

{% endblock %}
