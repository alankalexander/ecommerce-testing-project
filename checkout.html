{% extends "base.html" %}

{% block title %}
Checkout
{% endblock %}

{% block content %}

<div class="form-container">

    <h1>Checkout</h1>

    <form method="POST">

        <label>Name</label>

        <input
            type="text"
            name="name"
            placeholder="Enter your name"
            required
        >

        <label>Address</label>

        <input
            type="text"
            name="address"
            placeholder="Enter your address"
            required
        >

        <label>Phone</label>

        <input
            type="text"
            name="phone"
            placeholder="Enter your phone number"
            required
        >

        <button type="submit">
            Place Order
        </button>

    </form>

</div>

{% endblock %}
